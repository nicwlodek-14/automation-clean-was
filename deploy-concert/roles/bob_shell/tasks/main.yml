- name: Validate input variables
  ansible.builtin.include_tasks: validation.yml

- name: Prepare RedHat node for Bob Shell
  when: ansible_os_family == "RedHat"
  become: true
  block:
    - name: Ensure Node.js 20 module is enabled
      ansible.builtin.command:
        cmd: dnf module enable -y nodejs:20
      changed_when: true

    - name: Ensure Node.js is installed
      ansible.builtin.dnf:
        name: nodejs
        state: present

- name: Install Bob Shell
  ansible.builtin.include_tasks: install.yml

- name: Bob Shell info output
  ansible.builtin.debug:
    msg:
      - "Bob Shell binary: {{ bob_shell_bin_path }}"
      - "Set API key: ansible-playbook configure_bob_api_key.yml --extra-vars bob_shell_api_key=<key>"
      - "Run non-interactively: bob --auth-method api-key -P \"<your prompt>\""
