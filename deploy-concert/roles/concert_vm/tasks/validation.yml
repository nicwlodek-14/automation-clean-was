- name: Validate IBM Entitlement Key
  ansible.builtin.assert:
    that:
      - ibm_entitlement_key is string
      - ibm_entitlement_key | length > 0
    fail_msg: "The 'ibm_entitlement_key' must be defined as a non-empty string."
  when: ibm_entitlement_key is defined

- name: Validate install_workflows
  ansible.builtin.assert:
    that:
      - install_workflows is defined
      - (install_workflows is boolean) or (install_workflows is string)
    fail_msg: "'install_workflows' must be defined as a boolean or a string (e.g. true, false, 'true', 'false'). Only 'true'/true coerces to true; any other value is treated as false."

- name: Normalise install_workflows to a boolean
  ansible.builtin.set_fact:
    install_workflows: "{{ install_workflows | bool }}"

