- name: Validate enable_watsonx
  ansible.builtin.assert:
    that:
      - enable_watsonx is defined
      - (enable_watsonx is boolean) or (enable_watsonx is string)
    fail_msg: "'enable_watsonx' must be defined as a boolean or a string (e.g. true, false, 'true', 'false'). Only 'true'/true coerces to true; any other value is treated as false."

- name: Normalise enable_watsonx to a boolean
  ansible.builtin.set_fact:
    enable_watsonx: "{{ enable_watsonx | bool }}"

- name: Validate watsonx.ai credentials when enable_watsonx is true
  when: enable_watsonx
  ansible.builtin.assert:
    that:
      - watsonx_api_key is string
      - watsonx_api_key | length > 0
      - watsonx_api_project_id is string
      - watsonx_api_project_id | length > 0
      - watsonx_api_url is string
      - watsonx_api_url | length > 0
    fail_msg: "When 'enable_watsonx' is true, 'watsonx_api_key', 'watsonx_api_project_id', and 'watsonx_api_url' must all be non-empty strings."


